  <!-- Source boxes -->
  <g><rect x="55" y="138" width="200" height="80" rx="7" class="primary"/><text x="155" y="168" class="name">Android Library</text><text x="155" y="187" class="desc">Java / Kotlin / Scala</text><text x="155" y="202" class="desc">一个业务源码，多种发行形态</text></g>
  <g><rect x="55" y="258" width="200" height="80" rx="7" class="primary"/><text x="155" y="287" class="name">XML / resources</text><text x="155" y="306" class="desc">layout · values · color · drawable</text><text x="155" y="321" class="desc">bitmap 为编译输入，不进入插件</text></g>

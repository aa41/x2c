  <g><rect x="560" y="138" width="190" height="80" rx="7" class="secondary"/><text x="655" y="167" class="name">Typed Model / Registry</text><text x="655" y="186" class="desc">R2 symbols · View/LayoutParams</text><text x="655" y="201" class="desc">drawable graph · stable IDs</text></g>

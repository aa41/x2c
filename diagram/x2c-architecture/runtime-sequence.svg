<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1290">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
    .title { fill: #f8fafc; font-size: 22px; font-weight: 700; }
    .subtitle { fill: #94a3b8; font-size: 10px; }
    .actor { fill: #f8fafc; font-size: 10px; font-weight: 600; text-anchor: middle; }
    .actor-desc { fill: #94a3b8; font-size: 7.5px; text-anchor: middle; }
    .message { fill: #e2e8f0; font-size: 8px; text-anchor: middle; }
    .return { fill: #94a3b8; font-size: 8px; font-style: italic; text-anchor: middle; }
    .number { fill: #bfdbfe; font-size: 7px; font-weight: 700; text-anchor: middle; }
    .mask { fill: #0f172a; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#94a3b8"/></marker>
    <marker id="arrow-open" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polyline points="0 0,10 3.5,0 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#22d3ee"/></marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#a78bfa"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#fb923c"/></marker>
  </defs>

  <rect width="1800" height="1290" fill="#0f172a"/><rect width="1800" height="1290" fill="url(#grid)"/>
  <text x="30" y="35" class="title">X2C DYNAMIC PLUGIN · 安装与运行时序列</text>
  <text x="30" y="58" class="subtitle">一次进程初始化 → 签名安装 → 独立 ClassLoader → 模块/组件注册 → 宿主容器生命周期 → host fallback</text>

  <!-- Phase frames -->
  <rect x="20" y="160" width="1740" height="370" rx="8" fill="none" stroke="#fb7185" stroke-width="1" stroke-dasharray="6,4"/>
  <rect x="20" y="548" width="1740" height="365" rx="8" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="6,4"/>
  <rect x="20" y="930" width="1740" height="315" rx="8" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="6,4"/>
  <rect x="20" y="160" width="88" height="20" rx="4" fill="#1e293b" stroke="#fb7185"/><text x="64" y="174" fill="#fb7185" font-size="8" font-weight="600" text-anchor="middle">INSTALL</text>
  <rect x="20" y="548" width="112" height="20" rx="4" fill="#1e293b" stroke="#22d3ee"/><text x="76" y="562" fill="#22d3ee" font-size="8" font-weight="600" text-anchor="middle">BOOTSTRAP</text>
  <rect x="20" y="930" width="105" height="20" rx="4" fill="#1e293b" stroke="#a78bfa"/><text x="72" y="944" fill="#a78bfa" font-size="8" font-weight="600" text-anchor="middle">HOT PATH</text>

  <!-- Lifelines -->
  <g stroke="#334155" stroke-width="1" stroke-dasharray="6,4">
    <line x1="110" y1="140" x2="110" y2="1250"/><line x1="330" y1="140" x2="330" y2="1250"/>
    <line x1="550" y1="140" x2="550" y2="1250"/><line x1="770" y1="140" x2="770" y2="1250"/>
    <line x1="990" y1="140" x2="990" y2="1250"/><line x1="1210" y1="140" x2="1210" y2="1250"/>
    <line x1="1430" y1="140" x2="1430" y2="1250"/><line x1="1650" y1="140" x2="1650" y2="1250"/>
  </g>

  <!-- Activation bars -->
  <rect x="325" y="188" width="10" height="1020" rx="2" fill="#083344" stroke="#22d3ee"/>
  <rect x="545" y="342" width="10" height="174" rx="2" fill="#881337" stroke="#fb7185"/>
  <rect x="765" y="578" width="10" height="604" rx="2" fill="#4c1d95" stroke="#a78bfa"/>
  <rect x="985" y="636" width="10" height="256" rx="2" fill="#064e3b" stroke="#34d399"/>
  <rect x="1205" y="794" width="10" height="414" rx="2" fill="#4c1d95" stroke="#a78bfa"/>
  <rect x="1425" y="962" width="10" height="151" rx="2" fill="#1e293b" stroke="#94a3b8"/>
  <rect x="1645" y="1162" width="10" height="46" rx="2" fill="#7c2d12" stroke="#fb923c"/>

  <!-- Messages -->
  <path d="M335 198H390V222H335" fill="none" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <text x="407" y="213" class="message">Application.attachBaseContext → X2C.init(base)</text>

  <line x1="325" y1="258" x2="115" y2="258" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <text x="220" y="248" class="message">请求兼容 pluginId / version</text>
  <line x1="115" y1="304" x2="325" y2="304" stroke="#64748b" stroke-width="1.2" stroke-dasharray="6,3" marker-end="url(#arrow-open)"/>
  <text x="220" y="294" class="return">descriptor + RSA signature + DEX JAR stream</text>

  <line x1="335" y1="350" x2="545" y2="350" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="440" y="340" class="message">SignedPluginInstaller.install(...)</text>
  <path d="M555 388H625V414H555" fill="none" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="700" y="403" class="message">RSA / runtime ABI / version / downgrade 校验</text>
  <path d="M555 448H625V474H555" fill="none" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="704" y="463" class="message">只读 tmp 流式写入 + SHA-256 + fsync + atomic rename</text>
  <line x1="545" y1="510" x2="335" y2="510" stroke="#64748b" stroke-width="1.2" stroke-dasharray="6,3" marker-end="url(#arrow-open)"/>
  <text x="440" y="500" class="return">PluginPackage；任一失败则删除临时文件并拒绝安装</text>

  <line x1="335" y1="584" x2="765" y2="584" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
  <text x="550" y="574" class="message">create PluginClassLoader(parent = host ClassLoader)</text>
  <line x1="335" y1="642" x2="985" y2="642" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <text x="660" y="632" class="message">X2C.loadModule(context, anchorClass)</text>
  <line x1="985" y1="692" x2="775" y2="692" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="880" y="682" class="message">同一 loader 定位 namespace bootstrap</text>
  <line x1="775" y1="738" x2="985" y2="738" stroke="#64748b" stroke-width="1.2" stroke-dasharray="6,3" marker-end="url(#arrow-open)"/>
  <text x="880" y="728" class="return">generated X2cModuleBootstrap</text>
  <path d="M995 770H1060V796H995" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1112" y="785" class="message">注册 Provider / Layout / Image；anchor 映射缓存</text>

  <line x1="335" y1="808" x2="1205" y2="808" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
  <text x="770" y="798" class="message">PluginComponentManager.loadAndInstall(context, loader)</text>
  <line x1="1205" y1="852" x2="775" y2="852" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="990" y="842" class="message">一次 bootstrap reflection：load ComponentRegistry</text>
  <line x1="775" y1="892" x2="1205" y2="892" stroke="#64748b" stroke-width="1.2" stroke-dasharray="6,3" marker-end="url(#arrow-open)"/>
  <text x="990" y="882" class="return">原子安装 Activity / Service / Receiver / Provider metadata</text>

  <line x1="335" y1="974" x2="1205" y2="974" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
  <text x="770" y="964" class="message">startActivity / service / broadcast / provider URI</text>
  <line x1="1215" y1="1018" x2="1425" y2="1018" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1320" y="1008" class="message">分配固定 slot，构造宿主容器路由</text>
  <line x1="1425" y1="1062" x2="1215" y2="1062" stroke="#64748b" stroke-width="1.2" stroke-dasharray="6,3" marker-end="url(#arrow-open)"/>
  <text x="1320" y="1052" class="return">framework 创建容器并回调生命周期</text>
  <path d="M1215 1094H1280V1120H1215" fill="none" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
  <text x="1360" y="1109" class="message">generated registry 直接 new delegate + attach PluginContext</text>
  <line x1="1205" y1="1148" x2="995" y2="1148" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1100" y="1138" class="message">X2cResources.inflate / lifecycle bridge</text>
  <line x1="1205" y1="1180" x2="775" y2="1180" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
  <text x="990" y="1170" class="message">解析普通业务依赖：插件内 findClass miss</text>
  <line x1="775" y1="1204" x2="1645" y2="1204" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <text x="1210" y="1194" class="message">parent host ClassLoader → Host Facade / analytics / account / network</text>
  <line x1="1645" y1="1230" x2="1215" y2="1230" stroke="#64748b" stroke-width="1.2" stroke-dasharray="6,3" marker-end="url(#arrow-open)"/>
  <text x="1430" y="1220" class="return">共享宿主 class identity / singleton state</text>

  <!-- Message numbers -->
  <g>
    <circle cx="310" cy="198" r="9" fill="#1e3a8a" stroke="#60a5fa"/><text x="310" y="201" class="number">1</text>
    <circle cx="310" cy="258" r="9" fill="#1e3a8a" stroke="#60a5fa"/><text x="310" y="261" class="number">2</text>
    <circle cx="350" cy="350" r="9" fill="#1e3a8a" stroke="#60a5fa"/><text x="350" y="353" class="number">3</text>
    <circle cx="750" cy="584" r="9" fill="#1e3a8a" stroke="#60a5fa"/><text x="750" y="587" class="number">4</text>
    <circle cx="350" cy="642" r="9" fill="#1e3a8a" stroke="#60a5fa"/><text x="350" y="645" class="number">5</text>
    <circle cx="350" cy="808" r="9" fill="#1e3a8a" stroke="#60a5fa"/><text x="350" y="811" class="number">6</text>
    <circle cx="350" cy="974" r="9" fill="#1e3a8a" stroke="#60a5fa"/><text x="350" y="977" class="number">7</text>
    <circle cx="760" cy="1204" r="9" fill="#1e3a8a" stroke="#60a5fa"/><text x="760" y="1207" class="number">8</text>
  </g>

  <!-- Actor boxes, painted last -->
  <g>
    <rect x="20" y="82" width="180" height="58" rx="7" class="mask"/><rect x="20" y="82" width="180" height="58" rx="7" fill="#7c2d12" fill-opacity=".48" stroke="#fb923c" stroke-width="1.5"/>
    <text x="110" y="106" class="actor">Plugin Server / CDN</text><text x="110" y="124" class="actor-desc">catalog · descriptor · signature · payload</text>
    <rect x="240" y="82" width="180" height="58" rx="7" class="mask"/><rect x="240" y="82" width="180" height="58" rx="7" fill="#083344" fill-opacity=".62" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="330" y="106" class="actor">Host Application</text><text x="330" y="124" class="actor-desc">Application · navigation · process owner</text>
    <rect x="460" y="82" width="180" height="58" rx="7" class="mask"/><rect x="460" y="82" width="180" height="58" rx="7" fill="#881337" fill-opacity=".50" stroke="#fb7185" stroke-width="1.5"/>
    <text x="550" y="106" class="actor">SignedPluginInstaller</text><text x="550" y="124" class="actor-desc">authenticity · integrity · atomic storage</text>
    <rect x="680" y="82" width="180" height="58" rx="7" class="mask"/><rect x="680" y="82" width="180" height="58" rx="7" fill="#4c1d95" fill-opacity=".50" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="770" y="106" class="actor">PluginClassLoader</text><text x="770" y="124" class="actor-desc">plugin-first · host fallback · runtime parent-first</text>
    <rect x="900" y="82" width="180" height="58" rx="7" class="mask"/><rect x="900" y="82" width="180" height="58" rx="7" fill="#064e3b" fill-opacity=".58" stroke="#34d399" stroke-width="1.5"/>
    <text x="990" y="106" class="actor">X2C / Generated Module</text><text x="990" y="124" class="actor-desc">bootstrap · resources · layouts · images</text>
    <rect x="1120" y="82" width="180" height="58" rx="7" class="mask"/><rect x="1120" y="82" width="180" height="58" rx="7" fill="#4c1d95" fill-opacity=".50" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="1210" y="106" class="actor">Component Runtime</text><text x="1210" y="124" class="actor-desc">registry · manager · delegate · route</text>
    <rect x="1340" y="82" width="180" height="58" rx="7" class="mask"/><rect x="1340" y="82" width="180" height="58" rx="7" fill="#1e293b" fill-opacity=".82" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="1430" y="106" class="actor">Android Containers</text><text x="1430" y="124" class="actor-desc">Manifest slots · framework lifecycle</text>
    <rect x="1560" y="82" width="180" height="58" rx="7" class="mask"/><rect x="1560" y="82" width="180" height="58" rx="7" fill="#7c2d12" fill-opacity=".48" stroke="#fb923c" stroke-width="1.5"/>
    <text x="1650" y="106" class="actor">Host Facade / Services</text><text x="1650" y="124" class="actor-desc">stable ABI · keep · shared singleton</text>
  </g>

  <text x="900" y="1272" fill="#64748b" font-size="8" text-anchor="middle">反射只出现在固定 bootstrap 类的一次安装/模块发现；组件逐实例创建由 generated registry 直接 new</text>
</svg>
